<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend Day ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff4d6d,#ff99ac);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    width:90%;
    max-width:420px;
    box-shadow:0 0 30px rgba(0,0,0,.3);
    animation:pop 1s ease;
}

h1{
    color:#ff1744;
    font-size:35px;
}

p{
    color:#444;
    font-size:18px;
    line-height:1.6;
}

button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#ff1744;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#d50032;
}

@keyframes pop{
from{transform:scale(.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.heart{
    position:absolute;
    color:white;
    font-size:25px;
    animation:fall 6s linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(100vh);}
}
</style>
</head>

<body>

<div class="card">
<h1>❤️ Happy Girlfriend Day ponnuveyhh😭🫠 ❤️</h1>

<p>
To the most beautiful girl in my life... 🌹<br><br>

You are my happiness, my peace, and my biggest blessing.
Every moment with you is special.
Thank you for being part of my life.
<br><br>
<b>I Love You Forever ❤️</b>
</p>

<button onclick="love()">Click Me ❤️</button>
</div>

<script>

function love(){
alert("Happy Girlfriend Day punuveyy ❤️🥰");
}

for(let i=0;i<35;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"%";
h.style.animationDuration=(3+Math.random()*4)+"s";
h.style.fontSize=(18+Math.random()*25)+"px";
document.body.appendChild(h);
}

</script>

</body>
</html>
